[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl-decision-engine"
version = "0.1.0"
description = "Decision-support engine for Fantasy Premier League."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Harish Kamath" }]
dependencies = [
  "duckdb",
  "highspy",
  "polars",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "typer",
]

[project.scripts]
fpl = "fpl_decision_engine.cli:app"

[dependency-groups]
dev = [
  "pyright",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_decision_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
