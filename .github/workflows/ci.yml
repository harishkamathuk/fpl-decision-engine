name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue-numbered branch name
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feature|fix|hotfix|chore|docs|refactor|test|perf|build|ci)/[0-9]+-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Branch '$HEAD_REF' does not follow <type>/<issue-number>-<short-description>."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Tests
        run: uv run pytest
